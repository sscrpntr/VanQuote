  terms:
    title: "Términos y condiciones"
    introduction: "Estas condiciones describen el uso del servicio VanQuote. Léelas antes de crear una cuenta."
    back: "Volver al registro"
    sections:
      service:
        title: "1. Servicio"
        body: "VanQuote permite introducir recorridos y obtener una estimación orientativa del precio de un transporte. El servicio no sustituye una oferta confirmada por el proveedor del transporte."
      estimates:
        title: "2. Estimaciones"
        body: "Las estimaciones se calculan con la información disponible y los datos introducidos. El precio final puede variar según el volumen, acceso, disponibilidad, servicios adicionales y otros detalles que se confirmen posteriormente."
      account:
        title: "3. Cuenta"
        body: "La persona usuaria debe facilitar datos correctos, mantener la confidencialidad de sus credenciales y comunicarnos cualquier uso no autorizado de su cuenta. Es responsable de la actividad realizada desde su sesión."
      requests:
        title: "4. Solicitudes"
        body: "Crear un presupuesto no reserva un transporte ni obliga a contratarlo. Una solicitud de contacto solo se inicia cuando la persona elige expresamente una forma de contacto y completa los pasos que se le muestran."
      communications:
        title: "5. Comunicaciones"
        body: "La aceptación de estas condiciones no equivale al consentimiento para comunicaciones por email. Ese consentimiento se solicita por separado, se limita a la gestión de presupuestos y solicitudes iniciadas por la persona, y puede retirarse desde el perfil. No autoriza newsletters ni publicidad."
      privacy:
        title: "6. Datos personales"
        body: "Los datos se utilizan para prestar las funciones solicitadas, gestionar la cuenta y atender solicitudes. La información sobre el tratamiento, conservación y derechos debe consultarse en la información de privacidad aplicable al servicio."
      availability:
        title: "7. Disponibilidad y uso aceptable"
        body: "El servicio se ofrece sujeto a disponibilidad. No debe utilizarse de forma ilícita, para introducir datos de terceros sin autorización ni para interferir en su funcionamiento."
      changes:
        title: "8. Cambios"
        body: "Estas condiciones pueden actualizarse cuando cambie el servicio. La versión aceptada se registra al crear la cuenta; los cambios relevantes se comunicarán antes de que resulten aplicables cuando corresponda."
      contact:
        title: "9. Contacto"
        body: "Para consultas sobre estas condiciones o sobre el servicio, utiliza los canales de contacto que VanQuote ponga a disposición dentro del propio servicio."

