  terms:
    title: "Termes i condicions"
    introduction: "Aquestes condicions descriuen l'ús del servei VanQuote. Llegeix-les abans de crear un compte."
    back: "Tornar al registre"
    sections:
      service: { title: "1. Servei", body: "VanQuote permet introduir recorreguts i obtenir una estimació orientativa del preu d'un transport. El servei no substitueix una oferta confirmada pel proveïdor del transport." }
      estimates: { title: "2. Estimacions", body: "Les estimacions es calculen amb la informació disponible i les dades introduïdes. El preu final pot variar segons el volum, l'accés, la disponibilitat, els serveis addicionals i altres detalls que es confirmin posteriorment." }
      account: { title: "3. Compte", body: "La persona usuària ha de facilitar dades correctes, mantenir la confidencialitat de les credencials i comunicar qualsevol ús no autoritzat del compte." }
      requests: { title: "4. Sol·licituds", body: "Crear un pressupost no reserva un transport ni obliga a contractar-lo. Una sol·licitud de contacte només s'inicia quan la persona tria expressament una forma de contacte i completa els passos indicats." }
      communications: { title: "5. Comunicacions", body: "L'acceptació d'aquestes condicions no equival al consentiment per a comunicacions per email. Aquest consentiment se sol·licita per separat, es limita a gestionar pressupostos i sol·licituds iniciades per la persona i es pot retirar des del perfil. No autoritza butlletins ni publicitat." }
      privacy: { title: "6. Dades personals", body: "Les dades s'utilitzen per prestar les funcions sol·licitades, gestionar el compte i atendre sol·licituds. Consulta la informació de privacitat aplicable al servei per conèixer el tractament, la conservació i els drets." }
      availability: { title: "7. Disponibilitat i ús acceptable", body: "El servei s'ofereix subjecte a disponibilitat. No s'ha d'utilitzar de manera il·lícita, per introduir dades de tercers sense autorització ni per interferir en el funcionament." }
      changes: { title: "8. Canvis", body: "Aquestes condicions poden actualitzar-se quan canviï el servei. La versió acceptada es registra en crear el compte; els canvis rellevants es comunicaran abans que siguin aplicables quan correspongui." }
      contact: { title: "9. Contacte", body: "Per a consultes sobre aquestes condicions o el servei, utilitza els canals de contacte que VanQuote posi a disposició dins del servei." }

