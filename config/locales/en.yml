  terms:
    title: "Terms and conditions"
    introduction: "These terms describe how to use the VanQuote service. Please read them before creating an account."
    back: "Back to registration"
    sections:
      service: { title: "1. Service", body: "VanQuote lets users enter routes and receive an indicative transport price estimate. The service does not replace a confirmed offer from a transport provider." }
      estimates: { title: "2. Estimates", body: "Estimates use the information available and the details entered. The final price may vary based on volume, access, availability, additional services and other details confirmed later." }
      account: { title: "3. Account", body: "Users must provide accurate information, keep their credentials confidential and report unauthorized account use. Users are responsible for activity carried out through their session." }
      requests: { title: "4. Requests", body: "Creating a quote does not book transport or require a purchase. A contact request starts only when the user explicitly chooses a contact method and completes the steps shown." }
      communications: { title: "5. Communications", body: "Accepting these terms is not consent to email communications. That consent is requested separately, is limited to handling quotes and transport requests initiated by the user, and can be withdrawn from the profile. It does not authorize newsletters or advertising." }
      privacy: { title: "6. Personal data", body: "Data is used to provide requested features, manage accounts and handle requests. Consult the privacy information applicable to the service for details about processing, retention and rights." }
      availability: { title: "7. Availability and acceptable use", body: "The service is provided subject to availability. It must not be used unlawfully, to submit third-party data without authorization or to interfere with its operation." }
      changes: { title: "8. Changes", body: "These terms may be updated when the service changes. The accepted version is recorded when an account is created; relevant changes will be communicated before they apply when appropriate." }
      contact: { title: "9. Contact", body: "For questions about these terms or the service, use the contact channels VanQuote makes available within the service." }

